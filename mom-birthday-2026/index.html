<style>
:root {
  /* Layout: full-bleed painted sunset on the Ogden Point breakwater. The message sits
     top-left in the dark of the sky, away from the sun; controls run along the bottom. */
  --ink: #1a2146;
  --sky-deep: #1d2a55;
  --cream: #fff3df;
  --peach: #f9c58d;
  --rose: #e99a86;
  --lantern: #ffd97a;
  --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  --font-ui: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --gutter: clamp(20px, 6vw, 84px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky-deep);
  color: var(--cream);
  font-family: var(--font-ui);
  overflow: hidden;
}
.card {
  position: relative;
  height: 100%;
  overflow: hidden;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  transition: opacity .45s ease;
}
.card::before, .card::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  pointer-events: none;
  z-index: 1;
}
.card::before { top: 0; height: 52%; background: linear-gradient(to bottom, rgba(22, 28, 70, .5), rgba(22, 28, 70, 0)); }
.card::after { bottom: 0; height: 26%; background: linear-gradient(to top, rgba(18, 20, 52, .62), rgba(18, 20, 52, 0)); }

.words {
  position: absolute;
  z-index: 2;
  top: 0; left: 0; right: 0;
  padding: clamp(28px, 7vh, 76px) var(--gutter) 0;
  display: grid;
  pointer-events: none;
  transition: opacity .45s ease;
}
.beat {
  grid-area: 1 / 1;
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px);
  transition: opacity .5s ease, transform .5s ease, visibility 0s linear .5s;
  text-shadow: 0 2px 26px rgba(18, 22, 60, .6), 0 1px 2px rgba(18, 22, 60, .35);
}
.beat.on {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity .9s ease .85s, transform .9s cubic-bezier(.2, .7, .2, 1) .85s, visibility 0s;
}
.beat.on.first { transition-delay: 0s; }
.beat p, .beat h1 { margin: 0; text-wrap: balance; }
.title {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(3.2rem, 14vw, 6.5rem);
  line-height: .95;
  letter-spacing: -.02em;
}
.lede {
  margin-top: .9em !important;
  font-size: clamp(1rem, 3.6vw, 1.2rem);
  font-weight: 500;
  max-width: 24ch;
  line-height: 1.4;
  color: var(--peach);
}
.shout {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(3rem, 15vw, 7rem);
  line-height: .93;
  letter-spacing: -.03em;
  max-width: 100%;
}
.line {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.75rem, 6.6vw, 3.4rem);
  line-height: 1.12;
  letter-spacing: -.015em;
  max-width: 17ch;
}
.sign {
  font-family: var(--font-hand);
  font-weight: 700;
  font-size: clamp(3.6rem, 17vw, 7.5rem);
  line-height: 1;
  color: #fff8ea;
  transform: rotate(-4deg);
  transform-origin: left center;
  padding-top: .1em;
}

.bar {
  position: absolute;
  z-index: 2;
  left: 0; right: 0; bottom: 0;
  padding: 0 var(--gutter) clamp(18px, 4vh, 40px);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  transition: opacity .45s ease;
}
.where { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#map { width: 118px; height: auto; overflow: visible; display: block; }
#map .route { fill: none; stroke: rgba(255, 243, 223, .55); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#map .done { fill: none; stroke: var(--lantern); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
#map .light { fill: var(--lantern); }
#map .me { fill: var(--cream); stroke: var(--ink); stroke-width: 1.5; }
#dist {
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  color: var(--cream);

}
#go {
  flex: none;
  font: 600 1.02rem/1 var(--font-ui);
  color: var(--ink);
  background: var(--cream);
  border: 0;
  border-radius: 999px;

}

</style>
</head>
<body>
<main class="card" id="card">
  <canvas id="scene" role="img" aria-label="An illustrated sunset walk along the Ogden Point breakwater in Victoria, out to the lighthouse."></canvas>

  <div class="words" id="words" aria-live="polite">
    <div class="beat on first" data-beat="0">
      <h1 class="title">For Mom</h1>
      <p class="lede">A Birthday walk along Ogden Point</p>
    </div>
    <div class="beat" data-beat="1" aria-hidden="true"><p class="shout">Happy Birthday Mom!</p></div>
    <div class="beat" data-beat="2" aria-hidden="true"><p class="line">I hope you have an amazing year ahead full of great times and new memories.</p></div>
    <div class="beat" data-beat="3" aria-hidden="true"><p class="line">Looking forward to seeing you again in December.</p></div>
    <div class="beat" data-beat="4" aria-hidden="true"><p class="sign">Love, Oscar</p></div>
  </div>

  <div class="bar" id="bar">
    <div class="where">
      <svg id="map" viewBox="0 0 120 50" aria-hidden="true">
        <path class="route" id="mapRoute" d=""></path>
        <path class="done" id="mapDone" d=""></path>
        <circle class="light" id="mapLight" r="3.4"></circle>
        <circle class="me" id="mapMe" r="4"></circle>
      </svg>
      <span id="dist">762 m to go</span>
    </div>
    <button id="go" type="button"><span id="goLabel">Start walking</span><span class="arrow" aria-hidden="true">&rarr;</span></button>
  </div>

  <noscript>
    <div class="fallback">Happy Birthday Mom! I hope you have an amazing year ahead full of great times and new memories. Looking forward to seeing you again in December. Love, Oscar</div>
  </noscript>
</main>

<script>
(() => {
  'use strict';
  const card = document.getElementById('card');
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const goBtn = document.getElementById('go');
  const goLabel = document.getElementById('goLabel');
  const distEl = document.getElementById('dist');
  const beats = Array.from(document.querySelectorAll('.beat'));
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ?record films the card: time is stepped by the recorder instead of the real clock.
  const REC = /[?&]record\b/.test(location.search);
  let vnow = 0;
  const clock = () => REC ? vnow : performance.now();
  const DEG = Math.PI / 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  /* ---------- The breakwater: a path with two right-hand bends ---------- */
  const DS = 0.5, S_END = 125, LIGHT_S = 120, TOTAL_M = 762;
  const STOPS = [0, 28, 58, 88, 108];
  const N = Math.ceil((S_END + 14) / DS) + 2;
  const PX = new Float32Array(N), PZ = new Float32Array(N), TH = new Float32Array(N);
  const heading = s => 20 * DEG * smooth(34, 50, s) + 20 * DEG * smooth(70, 84, s);
  for (let i = 0; i < N; i++) {
    TH[i] = heading(i * DS);
    if (i > 0) {
      const tm = (TH[i] + TH[i - 1]) / 2;
      PX[i] = PX[i - 1] + Math.sin(tm) * DS;
      PZ[i] = PZ[i - 1] + Math.cos(tm) * DS;
    }
  }
  function pathAt(s) {
    if (s <= 0) return { x: 0, z: s, th: 0 };
    const f = Math.min(N - 1.001, s / DS), i = Math.floor(f), t = f - i;
    return { x: PX[i] + (PX[i + 1] - PX[i]) * t, z: PZ[i] + (PZ[i + 1] - PZ[i]) * t, th: TH[i] + (TH[i + 1] - TH[i]) * t };
  }
  const halfW = s => 1.8 + 0.8 * smooth(96, 114, s);

  /* ---------- Mini-map of the route ---------- */
  const mapPt = (() => {
    const end = pathAt(LIGHT_S);
    const sc = 108 / end.z, top = 6;
    return s => { const p = pathAt(s); return [6 + p.z * sc, top + (end.x - p.x) * sc]; };
  })();
  function mapPath(to) {
    let d = '';
    for (let s = 0; s <= to + 0.001; s += 2) { const [x, y] = mapPt(Math.min(s, to)); d += (s === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1); }
    const [x, y] = mapPt(to); d += 'L' + x.toFixed(1) + ' ' + y.toFixed(1);
    return d;
  }
  document.getElementById('mapRoute').setAttribute('d', mapPath(LIGHT_S));
  { const [x, y] = mapPt(LIGHT_S); const l = document.getElementById('mapLight'); l.setAttribute('cx', x); l.setAttribute('cy', y); }
  const mapMe = document.getElementById('mapMe'), mapDone = document.getElementById('mapDone');

  /* ---------- Camera and projection ---------- */
  let W = 0, H = 0, DPR = 1, F = 300, cx = 0, hy = 0;
  const cam = { x: 0, z: 0, yaw: 0, c: 1, sn: 0, eye: 1.6 };
  const NEAR = 0.14;
  const SUN_AZ = 52 * DEG;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = card.clientWidth; H = card.clientHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    F = 0.95 * Math.min(W, H * 0.62);
    cx = W / 2;
    hy = Math.round(H * (W < H ? 0.6 : 0.58));
  }
  function toCam(s, l, y) {
    const p = pathAt(s);
    const dx = p.x + l * Math.cos(p.th) - cam.x, dz = p.z - l * Math.sin(p.th) - cam.z;
    return [dx * cam.c - dz * cam.sn, y - cam.eye, dx * cam.sn + dz * cam.c];
  }
  const px = p => cx + F * p[0] / p[2];
  const py = p => hy - F * p[1] / p[2];
  function clipPoly(pts) {
    const out = [], n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n], ain = a[2] >= NEAR, bin = b[2] >= NEAR;
      if (ain) out.push(a);
      if (ain !== bin) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]); }
    }
    return out;
  }
  function fillPoly(pts, style) {
    const c = clipPoly(pts);
    if (c.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(px(c[0]), py(c[0]));
    for (let i = 1; i < c.length; i++) ctx.lineTo(px(c[i]), py(c[i]));
    ctx.closePath();
    ctx.fillStyle = style; ctx.fill();
    ctx.strokeStyle = style; ctx.lineWidth = 0.8; ctx.stroke();
  }
  function line3(a, b, wUnits, wMin, wMax, style) {
    if (a[2] < NEAR && b[2] < NEAR) return;
    if (a[2] < NEAR) { const t = (NEAR - a[2]) / (b[2] - a[2]); a = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]; }
    else if (b[2] < NEAR) { const t = (NEAR - b[2]) / (a[2] - b[2]); b = [b[0] + (a[0] - b[0]) * t, b[1] + (a[1] - b[1]) * t, NEAR]; }
    ctx.beginPath();
    ctx.moveTo(px(a), py(a)); ctx.lineTo(px(b), py(b));
    ctx.lineWidth = clamp(F * wUnits / ((a[2] + b[2]) / 2), wMin, wMax);
    ctx.strokeStyle = style; ctx.stroke();
  }
  const panX = az => { const d = clamp(az - cam.yaw, -1.4, 1.4); return cx + F * Math.tan(d); };
  const fog = d => Math.min(0.86, 1 - Math.exp(-Math.max(0, d) / 55));

  /* ---------- Sky, sun, clouds, stars ---------- */
  const CLOUDS = [[-1.25, .30, .55], [-.75, .40, .5], [-.28, .27, .62], [.2, .46, .5], [.5, .22, .46], [.86, .33, .7], [1.2, .2, .55], [1.5, .38, .6], [1.02, .52, .45]];
  const STARS = Array.from({ length: 46 }, (_, i) => [hash(i + 1), hash(i + 71) * .5, .5 + hash(i + 140)]);
  function drawSky(t, dusk) {
    const g = ctx.createLinearGradient(0, 0, 0, hy);
    g.addColorStop(0, '#1d2a55'); g.addColorStop(.34, '#4b4a86'); g.addColorStop(.62, '#a8709a');
    g.addColorStop(.82, '#e99a86'); g.addColorStop(.94, '#f9c58d'); g.addColorStop(1, '#ffe2ad');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hy + 2);

    const sx = panX(SUN_AZ), sy = hy - F * 0.03;
    let rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, F * 1.5);
    rg.addColorStop(0, 'rgba(255,224,160,.85)'); rg.addColorStop(.22, 'rgba(255,190,130,.42)');
    rg.addColorStop(.6, 'rgba(255,150,130,.12)'); rg.addColorStop(1, 'rgba(255,150,130,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, hy + 2);

    // stars come out as the walk goes on
    if (dusk > .35) {
      for (const [u, v, b] of STARS) {
        const a = (dusk - .35) * 1.1 * b * (.55 + .45 * Math.sin(t * 1.3 + u * 40)) * (1 - v * 1.6);
        if (a <= 0) continue;
        ctx.fillStyle = `rgba(255,246,225,${Math.min(.9, a)})`;
        ctx.fillRect(((u * W * 1.6 - cam.yaw * F * .6) % W + W) % W, v * hy, 1.6, 1.6);
      }
    }

    // clouds, lit from below
    for (let i = 0; i < CLOUDS.length; i++) {
      const [az0, el, w] = CLOUDS[i];
      const az = az0 - t * 0.0016;
      if (Math.abs(az - cam.yaw) > 1.3) continue;
      const x = panX(az), y = hy - F * Math.tan(el), r = F * w;
      const warm = clamp(1 - Math.abs(az - SUN_AZ) / 1.1, 0, 1);
      const body = mix([150, 120, 170], [255, 176, 140], warm), under = mix([226, 160, 180], [255, 222, 170], warm);
      for (let k = 0; k < 3; k++) {
        const ox = (k - 1) * r * .42, oy = (hash(i * 7 + k) - .5) * r * .08, rr = r * (.55 + hash(i * 3 + k) * .25);
        ctx.save(); ctx.translate(x + ox, y + oy); ctx.scale(1, .16);
        let cg = ctx.createRadialGradient(0, 0, 0, 0, 0, rr);
        cg.addColorStop(0, rgb(body, .5)); cg.addColorStop(1, rgb(body, 0));
        ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.fill();
        ctx.translate(0, rr * .35);
        cg = ctx.createRadialGradient(0, 0, 0, 0, 0, rr * .8);
        cg.addColorStop(0, rgb(under, .42)); cg.addColorStop(1, rgb(under, 0));
        ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, rr * .8, 0, 7); ctx.fill();
        ctx.restore();
      }
    }

    // sun
    rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, F * 0.06);
    rg.addColorStop(0, '#fffbe8'); rg.addColorStop(.75, '#ffe6a6'); rg.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sx, sy, F * 0.06, 0, 7); ctx.fill();
  }

  /* ---------- Olympic Mountains across the strait ---------- */
  const ridge = (a, f, p) => 1 - Math.abs(Math.sin(a * f + p));
  function farH(a) {
    const env = (0.14 + 0.86 * (1 - smooth(0.05, 0.72, a))) * (0.55 + 0.45 * smooth(-2.3, -1.0, a));
    return env * (0.42 * ridge(a, 4.3, .3) + 0.3 * ridge(a, 9.1, 1.1) + 0.17 * ridge(a, 21, 2) + 0.11 * ridge(a, 43, .7));
  }
  function nearH(a) {
    const env = 0.45 + 0.55 * smooth(0.2, 1.3, a);
    return env * (0.5 + 0.28 * Math.sin(a * 3.1 + 2) + 0.14 * Math.sin(a * 7.7 + .5) + 0.08 * Math.sin(a * 17 + 1.4));
  }
  function drawRange(fn, scale, top, bottom) {
    ctx.beginPath(); ctx.moveTo(0, hy + 1);
    let peak = 0;
    for (let x = 0; x <= W + 3; x += 3) {
      const h = fn(cam.yaw + Math.atan((x - cx) / F)) * F * scale;
      if (h > peak) peak = h;
      ctx.lineTo(x, hy - h);
    }
    ctx.lineTo(W, hy + 1); ctx.closePath();
    const g = ctx.createLinearGradient(0, hy - Math.max(peak, 4), 0, hy);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fill();
  }
  function drawSailboat() {
    const az = -0.3; if (Math.abs(az - cam.yaw) > 1.2) return;
    const x = panX(az), k = F * 0.022;
    ctx.fillStyle = 'rgba(60,50,95,.8)';
    ctx.beginPath(); ctx.moveTo(x, hy - k * 1.6); ctx.lineTo(x + k * .7, hy - k * .12); ctx.lineTo(x, hy - k * .12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - k * .08, hy - k * 1.3); ctx.lineTo(x - k * .55, hy - k * .12); ctx.lineTo(x - k * .08, hy - k * .12); ctx.closePath(); ctx.fill();
    ctx.fillRect(x - k * .7, hy - k * .12, k * 1.5, k * .14);
  }

  /* ---------- Water ---------- */
  const GLINTS = Array.from({ length: 150 }, (_, i) => ({ az: (hash(i + 5) - .5) * 3.4 + .4, d: Math.pow(hash(i + 300), 1.7), ph: hash(i + 900) * 6.28, sp: .7 + hash(i + 77) * 1.6 }));
  const GLITTER = Array.from({ length: 90 }, (_, i) => ({ off: (hash(i + 11) - .5), d: hash(i + 51), ph: hash(i + 31) * 6.28, sp: 1.2 + hash(i + 19) * 2.4 }));
  function drawWater(t) {
    const g = ctx.createLinearGradient(0, hy, 0, H);
    g.addColorStop(0, '#f6cc9c'); g.addColorStop(.07, '#dba195'); g.addColorStop(.28, '#8d709d');
    g.addColorStop(.62, '#48497f'); g.addColorStop(1, '#272d58');
    ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy);

    const sx = panX(SUN_AZ);
    ctx.save(); ctx.translate(sx, hy); ctx.scale(.42, 1);
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, (H - hy) * 1.05);
    rg.addColorStop(0, 'rgba(255,226,165,.75)'); rg.addColorStop(.4, 'rgba(255,186,140,.3)'); rg.addColorStop(1, 'rgba(255,170,140,0)');
    ctx.fillStyle = rg; ctx.fillRect(-W * 3, 0, W * 6, H - hy); ctx.restore();

    const depth = H - hy;
    ctx.lineCap = 'round';
    for (const q of GLINTS) {
      if (Math.abs(q.az - cam.yaw) > 1.25) continue;
      const a = Math.pow(Math.max(0, Math.sin(t * q.sp + q.ph)), 3) * (.1 + .3 * (1 - q.d));
      if (a < .02) continue;
      const y = hy + 3 + depth * q.d, len = 3 + 26 * q.d;
      const x = panX(q.az) + Math.sin(t * .3 + q.ph) * 6 * q.d;
      ctx.strokeStyle = `rgba(255,224,196,${a})`; ctx.lineWidth = .8 + 1.6 * q.d;
      ctx.beginPath(); ctx.moveTo(x - len / 2, y); ctx.lineTo(x + len / 2, y); ctx.stroke();
    }
    for (const q of GLITTER) {
      const a = Math.pow(Math.max(0, Math.sin(t * q.sp + q.ph)), 2) * (.75 - .45 * q.d);
      if (a < .03) continue;
      const y = hy + 2 + depth * q.d * q.d, spread = F * (.03 + .16 * q.d), len = 4 + 34 * q.d * q.d;
      const x = sx + q.off * spread * 2;
      ctx.strokeStyle = `rgba(255,240,196,${a})`; ctx.lineWidth = 1 + 2.2 * q.d;
      ctx.beginPath(); ctx.moveTo(x - len / 2, y); ctx.lineTo(x + len / 2, y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,236,200,.5)'; ctx.fillRect(0, hy - .5, W, 1.2);
  }

  /* ---------- Granite and concrete ---------- */
  const HAZE = [224, 162, 152];
  const C_DECK = [158, 136, 146], C_SLOPE_L = [72, 66, 104], C_LEDGE_L = [112, 98, 126], C_RISER_L = [58, 54, 90];
  const C_SLOPE_R = [198, 142, 124], C_LEDGE_R = [186, 148, 140], C_RISER_R = [176, 124, 112];
  const QUAD_COL = [C_SLOPE_L, C_LEDGE_L, C_RISER_L, C_DECK, C_RISER_R, C_LEDGE_R, C_SLOPE_R];
  const ORDER = [0, 6, 1, 5, 2, 4, 3];
  let camS = 0;
  function section(s) {
    const hw = halfW(s);
    return [toCam(s, -(hw + 4.0), -3.0), toCam(s, -(hw + 2.4), -1.4), toCam(s, -(hw + 0.6), -1.4), toCam(s, -hw, 0),
            toCam(s, hw, 0), toCam(s, hw + 0.6, -1.4), toCam(s, hw + 2.4, -1.4), toCam(s, hw + 4.0, -3.0)];
  }
  function drawBreakwater() {
    const sNear = Math.floor(camS) - 7;
    let far = section(S_END);
    for (let s = S_END - 1; s >= sNear; s--) {
      const near = section(s), f = fog(s + .5 - camS);
      for (const k of ORDER) {
        const j = k === 3 ? Math.floor(s / 3) * 13.7 : s * 3.1 + k * 17.3;
        const shade = 1 + (hash(j) - .5) * (k === 3 ? .07 : .2);
        const base = QUAD_COL[k];
        const col = mix([base[0] * shade, base[1] * shade, base[2] * shade], HAZE, f);
        fillPoly([far[k], far[k + 1], near[k + 1], near[k]], rgb(col));
      }
      if (s % 3 === 0) line3(near[3], near[4], 0.035, .4, 3, `rgba(70,56,92,${.4 * (1 - f)})`);
      far = near;
    }
    // long evening shadows from the right-hand rail posts
    const jFar = Math.floor(Math.min(S_END - 1, camS + 70) / 2.5), jNear = Math.floor((camS - 8) / 2.5);
    for (let j = jFar; j >= jNear; j--) {
      const s = j * 2.5, rel = SUN_AZ - heading(s), sn = Math.sin(rel);
      if (sn < .2) continue;
      const hw = halfW(s) - .12, ds = -Math.cos(rel) * (2 * hw / sn);
      line3(toCam(s, hw, .01), toCam(s + ds, -hw, .01), 0.11, .5, 18, `rgba(52,40,88,${.3 * (1 - fog(s - camS))})`);
    }
  }

  /* ---------- Railings ---------- */
  const RAIL_Y = [0.26, 0.52, 0.78];
  function drawRails(fromS, toS) {
    const step = 1.25;
    for (let j = Math.floor(fromS / step); j * step >= toS; j--) {
      const s = j * step, s2 = Math.min(s + step, S_END - .5), d = s - camS, f = fog(d);
      const top = rgb(mix([250, 236, 224], HAZE, f * .9)), cable = rgb(mix([236, 214, 214], HAZE, f), .75);
      for (const side of [-1, 1]) {
        const l1 = side * (halfW(s) - .12), l2 = side * (halfW(s2) - .12);
        for (const y of RAIL_Y) line3(toCam(s, l1, y), toCam(s2, l2, y), 0.012, .3, 2.2, cable);
        line3(toCam(s, l1, 1.06), toCam(s2, l2, 1.06), 0.06, .7, 9, top);
        if (j % 2 === 0) {
          const post = side < 0 ? rgb(mix([150, 136, 168], HAZE, f)) : rgb(mix([252, 232, 214], HAZE, f * .9));
          line3(toCam(s, l1, 0), toCam(s, l1, 1.08), 0.07, .8, 11, post);
        }
      }
    }
  }
  function drawEndRail() {
    const s = S_END - .5, hw = halfW(s) - .12, col = rgb(mix([250, 236, 224], HAZE, fog(s - camS) * .9));
    for (const y of RAIL_Y) line3(toCam(s, -hw, y), toCam(s, hw, y), 0.012, .3, 2.2, col);
    line3(toCam(s, -hw, 1.06), toCam(s, hw, 1.06), 0.06, .7, 9, col);
  }

  /* ---------- Lighthouse: white tower, red band at the base ---------- */
  const lantern = { x: 0, y: 0, k: 1, ok: false };
  function drawLighthouse(t, glow) {
    const p = toCam(LIGHT_S, 0, 0);
    if (p[2] < 1) { lantern.ok = false; return; }
    const k = F / p[2], x = px(p), y0 = py(p), f = fog(LIGHT_S - camS) * .75;
    const Y = h => y0 - h * k;
    const trap = (h0, h1, w0, w1, fill) => {
      ctx.beginPath(); ctx.moveTo(x - w0 * k / 2, Y(h0)); ctx.lineTo(x + w0 * k / 2, Y(h0));
      ctx.lineTo(x + w1 * k / 2, Y(h1)); ctx.lineTo(x - w1 * k / 2, Y(h1)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    };
    const side = (w, a, b, c) => { const g = ctx.createLinearGradient(x - w * k / 2, 0, x + w * k / 2, 0); g.addColorStop(0, rgb(mix(a, HAZE, f))); g.addColorStop(.72, rgb(mix(b, HAZE, f))); g.addColorStop(1, rgb(mix(c, HAZE, f))); return g; };
    trap(0, .45, 3.1, 3.1, side(3.1, [104, 92, 124], [136, 118, 140], [214, 168, 150]));
    trap(.45, 1.5, 2.3, 2.2, side(2.3, [140, 46, 62], [176, 58, 62], [238, 120, 92]));
    trap(1.5, 6.0, 2.2, 1.5, side(2.2, [170, 156, 196], [214, 200, 222], [255, 240, 216]));
    // door and a small window
    ctx.fillStyle = rgb(mix([84, 34, 54], HAZE, f));
    ctx.fillRect(x - .32 * k, Y(1.42), .64 * k, .97 * k);
    ctx.fillStyle = rgb(mix([92, 86, 130], HAZE, f));
    ctx.fillRect(x - .14 * k, Y(4.3), .28 * k, .5 * k);
    // gallery
    trap(6.0, 6.2, 2.2, 2.2, rgb(mix([78, 70, 106], HAZE, f)));
    ctx.strokeStyle = rgb(mix([96, 86, 124], HAZE, f)); ctx.lineWidth = Math.max(.6, .05 * k);
    ctx.beginPath(); ctx.moveTo(x - 1.05 * k, Y(6.72)); ctx.lineTo(x + 1.05 * k, Y(6.72));
    for (let i = -3; i <= 3; i++) { ctx.moveTo(x + i * .35 * k, Y(6.2)); ctx.lineTo(x + i * .35 * k, Y(6.72)); }
    ctx.stroke();
    // lantern room
    const lg = ctx.createLinearGradient(0, Y(7.15), 0, Y(6.2));
    lg.addColorStop(0, '#fffbe0'); lg.addColorStop(1, '#ffd27a');
    trap(6.2, 7.15, 1.1, 1.1, lg);
    ctx.strokeStyle = rgb(mix([110, 50, 60], HAZE, f)); ctx.lineWidth = Math.max(.6, .06 * k);
    ctx.beginPath();
    for (const o of [-.55, -.18, .18, .55]) { ctx.moveTo(x + o * k, Y(6.2)); ctx.lineTo(x + o * k, Y(7.15)); }
    ctx.stroke();
    // red cap
    ctx.beginPath(); ctx.moveTo(x - .78 * k, Y(7.15)); ctx.lineTo(x + .78 * k, Y(7.15));
    ctx.quadraticCurveTo(x + .5 * k, Y(7.75), x, Y(7.95)); ctx.quadraticCurveTo(x - .5 * k, Y(7.75), x - .78 * k, Y(7.15));
    ctx.fillStyle = side(1.56, [128, 40, 58], [178, 56, 60], [240, 122, 94]); ctx.fill();
    ctx.fillRect(x - .05 * k, Y(8.3), .1 * k, .4 * k);

    lantern.x = x; lantern.y = Y(6.68); lantern.k = k; lantern.ok = true;
    // steady glow so the light is a waypoint from the far end
    const r = Math.max(7, k * 1.5) * (1 + .5 * glow);
    const g = ctx.createRadialGradient(lantern.x, lantern.y, 0, lantern.x, lantern.y, r);
    g.addColorStop(0, `rgba(255,246,200,${.85 * glow})`); g.addColorStop(.3, `rgba(255,220,130,${.4 * glow})`); g.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(lantern.x, lantern.y, r, 0, 7); ctx.fill(); ctx.restore();
  }
  function drawBeam(t, I) {
    if (!lantern.ok || I <= 0.01) return;
    const phi = reduce ? 0.5 : t * 1.15, c = Math.cos(phi), toward = Math.sin(phi);
    const L = Math.max(W, H) * 0.95, x = lantern.x, y = lantern.y;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const len = L * (0.18 + 0.82 * Math.abs(c)), dir = c >= 0 ? 1 : -1;
    const hwid = L * (0.05 + 0.2 * (1 - Math.abs(c)) * (toward > 0 ? 1 : .45));
    const ex = x + dir * len, rise = -len * 0.05;
    const g = ctx.createLinearGradient(x, y, ex, y + rise);
    const a = I * (0.2 + 0.2 * (1 - Math.abs(c)));
    g.addColorStop(0, `rgba(255,244,200,${a + .2 * I})`); g.addColorStop(.5, `rgba(255,236,180,${a * .5})`); g.addColorStop(1, 'rgba(255,230,170,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y - lantern.k * .3); ctx.lineTo(ex, y + rise - hwid); ctx.lineTo(ex, y + rise + hwid); ctx.lineTo(x, y + lantern.k * .3); ctx.closePath(); ctx.fill();
    // the flash as the beam swings past you
    const flash = Math.pow(Math.max(0, toward), 10) * I;
    if (flash > .01) {
      const r = F * (0.5 + 1.1 * flash);
      const fg = ctx.createRadialGradient(x, y, 0, x, y, r);
      fg.addColorStop(0, `rgba(255,250,225,${.95 * flash})`); fg.addColorStop(.18, `rgba(255,234,170,${.5 * flash})`); fg.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- The surprise: a harbour seal ---------- */
  const seal = { up: 0, s: 105, l: halfW(105) + 4.0 + 1.5 };
  function drawSeal(t) {
    if (seal.up <= 0.01) return;
    const p = toCam(seal.s, seal.l, -3.0);
    if (p[2] < 1) return;
    const k = F / p[2], x = px(p), y = py(p), u = ease(seal.up), r = Math.max(9, .78 * k);
    ctx.save();
    ctx.lineWidth = Math.max(1, r * .08);
    for (let i = 0; i < 3; i++) {
      const ph = ((t * .45 + i / 3) % 1), rr = r * (1.2 + ph * 2.6);
      ctx.strokeStyle = `rgba(255,232,206,${.5 * u * (1 - ph)})`;
      ctx.beginPath(); ctx.ellipse(x, y, rr, rr * .2, 0, 0, 7); ctx.stroke();
    }
    ctx.beginPath(); ctx.rect(x - r * 4, y - r * 5, r * 8, r * 5); ctx.clip();
    const hyy = y - r * .55 * u + r * 1.6 * (1 - u) + Math.sin(t * 1.7) * r * .06;
    const g = ctx.createLinearGradient(x - r, 0, x + r, 0);
    g.addColorStop(0, '#2f2a4c'); g.addColorStop(.7, '#4a3f5e'); g.addColorStop(1, '#c98f86');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x, hyy, r, r * 1.08, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a4d6c'; ctx.beginPath(); ctx.ellipse(x, hyy + r * .28, r * .56, r * .4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#17142c';
    ctx.beginPath(); ctx.ellipse(x - r * .38, hyy - r * .18, r * .15, r * .17, 0, 0, 7); ctx.ellipse(x + r * .38, hyy - r * .18, r * .15, r * .17, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, hyy + r * .12, r * .13, r * .09, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,246,230,.9)';
    ctx.beginPath(); ctx.arc(x - r * .34, hyy - r * .23, r * .05, 0, 7); ctx.arc(x + r * .42, hyy - r * .23, r * .05, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,236,220,.6)'; ctx.lineWidth = Math.max(.6, r * .035);
    ctx.beginPath();
    for (const sgn of [-1, 1]) for (const dy of [-.04, .1, .24]) { ctx.moveTo(x + sgn * r * .3, hyy + r * .3); ctx.lineTo(x + sgn * r * 1.02, hyy + r * (.26 + dy)); }
    ctx.stroke();
    ctx.restore();
  }


  /* ---------- Four orcas, coming in from the lighthouse along the left side ---------- */
  const POD = [
    { ds: 0, lat: 15, fin: .95, sz: 1, ph: 0, male: false },
    { ds: 4, lat: 18.5, fin: 1.9, sz: 1.15, ph: .3, male: true },
    { ds: 6.5, lat: 14, fin: 1.0, sz: .95, ph: .5, male: false },
    { ds: 10, lat: 17, fin: .85, sz: .85, ph: .78, male: false }
  ];
  let podT0 = null;
  function drawOrcas(now) {
    if (podT0 === null) return;
    const el = reduce ? 0 : now / 1000 - podT0;
    const lead = reduce ? camS + 4 : 82 - 2.0 * el;
    for (let i = POD.length - 1; i >= 0; i--) {
      const o = POD[i], s = lead + o.ds;
      if (s < camS - 6) continue;
      const l = -o.lat;
      const p = toCam(s, l, -3.0);
      if (p[2] < 2) continue;
      const q = toCam(s - 1.5, l, -3.0);
      const k = F / p[2], x = px(p), y = py(p);
      if (x < -200 || x > W + 200) continue;
      const dxs = (q[2] > .5 ? px(q) : x - 1) - x, dir = dxs < 0 ? -1 : 1;
      const fore = clamp(Math.abs(dxs) / (k * 1.5), .5, 1);
      const u = reduce ? .32 : ((el / 5.2 + o.ph) % 1 + 1) % 1;
      const VIS = .68, r = u < VIS ? Math.sin(Math.PI * u / VIS) : 0;
      const f = fog(s - camS) * .55;
      const sz = o.sz * k * 1.15, a = 2.7 * sz * fore, b = .85 * sz;
      // footprints on the water
      ctx.lineWidth = Math.max(.8, sz * .05);
      for (let j = 0; j < 2; j++) {
        const ph = ((el * .4 + j / 2 + o.ph) % 1 + 1) % 1, rr = a * (.7 + ph * 1.1);
        ctx.strokeStyle = `rgba(255,232,206,${.34 * (1 - ph)})`;
        ctx.beginPath(); ctx.ellipse(x, y, rr, Math.max(1, rr * .15), 0, 0, 7); ctx.stroke();
      }
      if (r <= .02) continue;
      const top = y - r * .66 * sz, cy = top + b;
      const dark = rgb(mix([24, 22, 48], HAZE, f));
      ctx.save();
      ctx.beginPath(); ctx.rect(x - a * 2, y - sz * 5, a * 4, sz * 5); ctx.clip();
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.ellipse(x, cy, a, b, 0, 0, 7); ctx.fill();
      // dorsal fin: tall and straight on the big male, curved on the others
      const fx = x - dir * a * .08, fb = top + b * .14, fh = o.fin * sz, fw = (o.male ? .56 : .7) * sz * (.6 + .4 * fore);
      const tipx = fx - dir * fw * (o.male ? .08 : .58), tipy = fb - fh;
      ctx.beginPath();
      ctx.moveTo(fx + dir * fw * .5, fb);
      ctx.quadraticCurveTo(fx + dir * fw * .12, fb - fh * .62, tipx, tipy);
      ctx.quadraticCurveTo(fx - dir * fw * (o.male ? .32 : .2), fb - fh * .32, fx - dir * fw * .5, fb);
      ctx.closePath(); ctx.fill();
      // saddle patch, eye patch, and the sunset catching the back
      ctx.fillStyle = rgb(mix([176, 166, 192], HAZE, f), .6);
      ctx.beginPath(); ctx.ellipse(fx - dir * a * .2, top + b * .34, a * .15, b * .2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,244,232,.92)';
      ctx.beginPath(); ctx.ellipse(x + dir * a * .64, top + b * .6, a * .09, b * .15, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,196,160,.55)'; ctx.lineWidth = Math.max(1, sz * .06);
      ctx.beginPath(); ctx.ellipse(x, cy, a, b, 0, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = `rgba(255,244,230,${.65 * r})`; ctx.lineWidth = Math.max(1, sz * .09);
      ctx.beginPath(); ctx.ellipse(x, y, a * 1.02, Math.max(1, sz * .09), 0, 0, 7); ctx.stroke();
      // the blow
      if (u < .3 && !reduce) {
        const bp = u / .3, bx = x + dir * a * .55 - dir * sz * .2 * bp, bh = sz * (1.3 + 1.7 * bp), by = y - bh * .55;
        ctx.save(); ctx.translate(bx, by); ctx.scale(.32 + .22 * bp, 1);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, bh * .6);
        g.addColorStop(0, `rgba(255,240,224,${.6 * (1 - bp)})`); g.addColorStop(1, 'rgba(255,236,220,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, bh * .6, 0, 7); ctx.fill(); ctx.restore();
      }
    }
  }

  /* ---------- Gulls ---------- */
  const GULLS = [[-.6, .2, .011, 1, 0], [.1, .29, -.008, .7, 2], [.7, .16, .014, .85, 4], [1.25, .24, -.01, .6, 1], [-1.2, .33, .009, .55, 3]];
  function drawGulls(t) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const [az0, el, sp, size, ph] of GULLS) {
      let az = az0 + t * sp; az = ((az + 1.9) % 3.8 + 3.8) % 3.8 - 1.9 + .35;
      if (Math.abs(az - cam.yaw) > 1.2) continue;
      const x = panX(az), y = hy - F * Math.tan(el) + Math.sin(t * .7 + ph) * F * .012;
      const w = F * .045 * size, flap = Math.sin(t * 4.2 + ph * 2) * .55;
      ctx.strokeStyle = 'rgba(40,40,82,.82)'; ctx.lineWidth = Math.max(1.1, w * .13);
      ctx.beginPath();
      ctx.moveTo(x - w, y - w * flap * .7);
      ctx.quadraticCurveTo(x - w * .45, y - w * (.35 + flap * .5), x, y);
      ctx.quadraticCurveTo(x + w * .45, y - w * (.35 + flap * .5), x + w, y - w * flap * .7);
      ctx.stroke();
    }
  }

  /* ---------- Confetti ---------- */
  const CONF_COL = ['#ffd97a', '#fff3df', '#f39a8b', '#8fd0c8', '#ffffff', '#f6b6c8'];
  let confetti = [];
  function burst(n, power) {
    if (reduce || !lantern.ok) return;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.5, v = power * (.35 + Math.random() * .75);
      confetti.push({ x: lantern.x, y: lantern.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - .5) * 12,
        w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, c: CONF_COL[(Math.random() * CONF_COL.length) | 0], sw: Math.random() * 6.28 });
    }
  }
  function drawConfetti(dt, t) {
    if (!confetti.length) return;
    const next = [];
    for (const q of confetti) {
      q.vy += 260 * dt; q.vx *= (1 - 1.1 * dt); q.vy *= (1 - .9 * dt);
      q.x += (q.vx + Math.sin(t * 2.2 + q.sw) * 34) * dt; q.y += q.vy * dt; q.r += q.vr * dt;
      if (q.y > H + 30) continue;
      next.push(q);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.scale(1, Math.cos(q.r * 1.7 + q.sw));
      ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); ctx.restore();
    }
    confetti = next;
  }

  /* ---------- Story state ---------- */
  let burst2 = 0, stage = 0, walk = null, finale = 0, finaleFired = false, glance = 0, side = 0, last = 0, swapping = false;

  function setStage(n) {
    stage = n;
    beats.forEach((b, i) => { const on = i === n; b.classList.toggle('on', on); b.classList.remove('first'); b.setAttribute('aria-hidden', on ? 'false' : 'true'); });
    goLabel.textContent = n === 0 ? 'Start walking' : n === 4 ? 'Walk it again' : 'Keep walking';
  }
  function busy() { return swapping || (walk && walk.p < 0.6); }
  function advance() {
    if (busy()) return;
    if (stage >= 4) return replay();
    setStage(stage + 1);
    if (stage === 2) podT0 = clock() / 1000;
    walk = { from: camS, to: STOPS[stage], t0: clock(), dur: reduce ? 1 : (stage === 4 ? 4400 : 3700), p: 0 };
    goBtn.setAttribute('aria-disabled', 'true');
  }
  function replay() {
    swapping = true; card.classList.add('fade'); goBtn.setAttribute('aria-disabled', 'true');
    setTimeout(() => {
      camS = 0; walk = null; finale = 0; finaleFired = false; confetti = []; burst2 = 0; seal.up = 0; glance = 0; side = 0; podT0 = null;
      setStage(0); beats[0].classList.add('first');
      card.classList.remove('fade'); swapping = false; goBtn.setAttribute('aria-disabled', 'false');
    }, reduce ? 20 : 480);
  }
  goBtn.addEventListener('click', e => { e.stopPropagation(); advance(); });
  card.addEventListener('click', advance);
  document.addEventListener('keydown', e => {
    if (e.target === goBtn) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
  });

  function updateHud() {
    const frac = clamp(camS / STOPS[4], 0, 1), m = Math.round(TOTAL_M * (1 - frac));
    const label = m <= 0 ? 'At the lighthouse' : m + ' m to go';
    if (distEl.textContent !== label) distEl.textContent = label;
    const [x, y] = mapPt(camS);
    mapMe.setAttribute('cx', x.toFixed(1)); mapMe.setAttribute('cy', y.toFixed(1));
    mapDone.setAttribute('d', mapPath(camS));
  }

  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    const t = reduce ? 3 : now / 1000;

    let bob = 0;
    if (walk) {
      const p = clamp((now - walk.t0) / walk.dur, 0, 1);
      walk.p = p; camS = walk.from + (walk.to - walk.from) * ease(p);
      bob = Math.sin(Math.PI * p);
      if (p >= .6 && !swapping) goBtn.setAttribute('aria-disabled', 'false');
      if (p >= 1) walk = null;
    }
    const sealTarget = stage === 3 && (!walk || walk.p > .72) ? 1 : 0;
    seal.up = reduce ? sealTarget : clamp(seal.up + (sealTarget ? dt / 1.0 : -dt / .5), 0, 1);
    const lookOut = stage === 2 && (!walk || walk.p > .6);
    const lookTarget = lookOut ? -1.08 : 0.2 * ease(seal.up), sideTarget = lookOut ? -0.9 : 0;
    const turn = reduce ? 1 : 1 - Math.exp(-dt * 1.8);
    glance += (lookTarget - glance) * turn;
    side += (sideTarget - side) * turn;

    const atEnd = stage === 4 && (!walk || walk.p > .8);
    finale = reduce ? (atEnd ? 1 : 0) : clamp(finale + (atEnd ? dt / 1.4 : -dt), 0, 1);
    if (atEnd && !finaleFired) { finaleFired = true; }

    const p0 = pathAt(camS), p1 = pathAt(camS + 9);
    cam.x = p0.x + side * Math.cos(p0.th); cam.z = p0.z - side * Math.sin(p0.th); cam.yaw = Math.atan2(p1.x - p0.x, p1.z - p0.z) + glance;
    cam.c = Math.cos(cam.yaw); cam.sn = Math.sin(cam.yaw);
    cam.eye = 1.6 + 0.04 * bob * Math.sin(camS * 2.3);
    const dusk = clamp(camS / STOPS[4], 0, 1);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky(t, dusk);
    drawRange(farH, 0.118, 'rgba(98,88,146,.95)', 'rgba(204,146,160,.9)');
    drawRange(nearH, 0.03, 'rgba(70,62,116,.95)', 'rgba(128,96,134,.95)');
    drawSailboat();
    drawWater(t);
    drawBreakwater();
    drawOrcas(now);
    drawSeal(t);
    drawEndRail();
    drawRails(S_END - 1.5, LIGHT_S + .01);
    const blink = .55 + .45 * Math.pow(Math.max(0, Math.sin(t * 1.15)), 6);
    drawLighthouse(t, clamp(.5 + .5 * blink + finale * .3, 0, 1.2));
    drawRails(LIGHT_S, camS - 8);
    drawGulls(t);
    // the evening deepens on the way out
    ctx.fillStyle = `rgba(22,18,58,${.2 * dusk})`; ctx.fillRect(0, 0, W, H);
    drawBeam(t, finale);
    if (finaleFired === true && lantern.ok) { finaleFired = 2; burst(150, 620); burst2 = now + 650; }
    if (burst2 && now >= burst2) { burst2 = 0; burst(90, 480); }
    drawConfetti(dt, t);

    updateHud();
    if (!REC) requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  if (REC) {
    // Autoplay cues (ms): when each "tap" happens, and when the film ends.
    const CUES = [2600, 8600, 25600, 33600], END = 46000, FPS = 30;
    let cue = 0, stageAt = -1e9, prev = -1;
    document.documentElement.classList.add('rec');
    const paint = () => {
      frame(vnow);
      beats.forEach((b, i) => {
        let a = 0;
        if (i === stage) a = stageAt < 0 ? 1 : ease(clamp((vnow - stageAt - 850) / 900, 0, 1));
        else if (i === prev) a = 1 - clamp((vnow - stageAt) / 500, 0, 1);
        b.style.opacity = a; b.style.visibility = a > 0 ? 'visible' : 'hidden'; b.style.transform = `translateY(${(1 - a) * 14}px)`;
      });
    };
    window.__card = {
      fps: FPS, frames: Math.round(END / 1000 * FPS),
      step() {
        vnow += 1000 / FPS;
        while (cue < CUES.length && vnow >= CUES[cue]) { cue++; prev = stage; advance(); stageAt = vnow; }
        paint();
      }
    };
    paint();
  } else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
